<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCentral - Login</title>
    
    <!-- Django CSRF Token for security -->
    {% csrf_token %}
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 1s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .left-side {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .left-side::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(45deg);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% { left: -100%; top: -100%; }
            100% { left: 100%; top: 100%; }
        }

        .pharma-image {
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            animation: pulse 3s ease infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px 10px rgba(255,255,255,0.4); }
        }

        .pharma-image svg {
            width: 200px;
            height: 200px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }

        .left-side h2 {
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
            animation: fadeInUp 1s ease;
            z-index: 1;
        }

        .left-side p {
            text-align: center;
            opacity: 0.9;
            line-height: 1.6;
            animation: fadeInUp 1s ease 0.3s both;
            z-index: 1;
        }

        .right-side {
            flex: 1;
            padding: 60px 50px;
            background: white;
            animation: slideInRight 1s ease;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: #666;
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* Message display for Django messages */
        .messages {
            margin-bottom: 20px;
        }
        
        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: slideInMessage 0.5s ease;
        }
        
        @keyframes slideInMessage {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-error {
            background: #fee;
            color: #ff4444;
            border-left: 4px solid #ff4444;
        }
        
        .alert-success {
            background: #e8f5e9;
            color: #00cc66;
            border-left: 4px solid #00cc66;
        }
        
        .alert-info {
            background: #e3f2fd;
            color: #2196f3;
            border-left: 4px solid #2196f3;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.1);
            transform: translateY(-3px);
            background: white;
        }

        .input-group input.error {
            border-color: #ff4444;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }

        .btn-login:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .register-link {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 15px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .demo-credentials p {
            color: #666;
            margin: 8px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .demo-credentials i {
            color: #667eea;
        }

        .demo-credentials .credential-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #e0e0e0;
        }

        .demo-credentials .credential-box span {
            font-family: monospace;
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .left-side {
                padding: 30px;
            }
            
            .pharma-image {
                width: 200px;
                height: 200px;
            }
            
            .pharma-image svg {
                width: 150px;
                height: 150px;
            }
            
            .right-side {
                padding: 40px 30px;
            }
            
            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <div class="pharma-image">
                <svg viewBox="0 0 100 100" fill="white">
                    <circle cx="50" cy="50" r="40" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M50 20 L50 80 M20 50 L80 50" stroke="white" stroke-width="4"/>
                    <circle cx="50" cy="50" r="10" fill="white"/>
                </svg>
            </div>
            <h2>Welcome Back!</h2>
            <p>Manage your pharmacy efficiently<br>with PharmaCentral</p>
        </div>

        <div class="right-side">
            <div class="logo">
                <h1>PharmaCentral</h1>
                <p>Pharmacy Management System</p>
            </div>

            <!-- Django Messages Display -->
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form id="loginForm" method="POST" action="{% url 'login' %}">
                <!-- CSRF Token - Required for Django security -->
                {% csrf_token %}
                
                <div class="input-group">
                    <label>📧 Email Address</label>
                    <input type="email" name="email" id="username" placeholder="Enter your email" required autofocus>
                </div>

                <div class="input-group">
                    <label>🔒 Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember" checked> Remember me
                    </label>
                    <a href="{% url 'forgot_password' %}" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Login to Dashboard</span>
                    <span id="btnLoader" class="loader" style="display: none;"></span>
                </button>

                <div class="register-link">
                    Don't have an account? <a href="{% url 'register' %}">Register Here</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Get elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Add animation to inputs
        const inputs = document.querySelectorAll('.input-group input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Form submission with loading animation
        loginForm.addEventListener('submit', function(e) {
            // Get values
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Validation
            if (!username || !password) {
                e.preventDefault();
                alert('Please fill in all fields');
                return;
            }
            
            // Show loading animation
            btnText.textContent = 'Logging in...';
            btnLoader.style.display = 'inline-block';
            loginBtn.disabled = true;
            
            // Form will submit normally to Django
        });

        // Auto-fill demo credentials on click
        document.querySelectorAll('.demo-credentials .credential-box span').forEach(span => {
            span.addEventListener('click', function() {
                const text = this.textContent;
                
                // Determine if it's username or password based on context
                if (this.textContent.includes('admin') || 
                    this.textContent.includes('pharmacist') || 
                    this.textContent.includes('cashier')) {
                    usernameInput.value = this.textContent;
                    usernameInput.focus();
                } else {
                    passwordInput.value = this.textContent;
                    passwordInput.focus();
                }
                
                // Visual feedback
                this.style.background = '#667eea';
                this.style.color = 'white';
                setTimeout(() => {
                    this.style.background = '#f0f0f0';
                    this.style.color = '#666';
                }, 300);
            });
        });

        // Remove any existing error class on focus
        usernameInput.addEventListener('focus', () => {
            usernameInput.classList.remove('error');
        });
        
        passwordInput.addEventListener('focus', () => {
            passwordInput.classList.remove('error');
        });

        // Add error class if fields are empty on blur
        usernameInput.addEventListener('blur', function() {
            if (!this.value.trim()) {
                this.classList.add('error');
            } else {
                this.classList.remove('error');
            }
        });
        
        passwordInput.addEventListener('blur', function() {
            if (!this.value.trim()) {
                this.classList.add('error');
            } else {
                this.classList.remove('error');
            }
        });
    </script>
</body>
</html>
